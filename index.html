<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>キングダム乱 数値計算シミュレーター</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* レイアウト調整 */
        #capture-area { width: 1150px !important; padding: 20px; background: #000; }
        .army-section { margin-bottom: 40px; }
        .army-label { padding: 10px; font-weight: bold; text-align: center; border: 1px solid var(--border-gold); margin-bottom: 10px; border-radius: 4px; width: 100%; }
        .player-label { background: #003366; color: white; }
        .enemy-label { background: #660000; color: white; }
        
        .formation-grid { display: flex; gap: 8px; justify-content: flex-start; }
        .unit-column { width: 155px; flex-shrink: 0; display: flex; flex-direction: column; gap: 5px; }

        /* スロット・育成エリア */
        .slot-wrapper { background: rgba(255,255,255,0.05); padding: 5px; border: 1px solid #333; }
        .training-settings { 
            background: rgba(0, 0, 0, 0.5); border: 1px solid var(--border-gold); 
            padding: 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin-top: 4px;
        }
        .training-label { display: flex; align-items: center; gap: 2px; font-size: 0.6rem; color: #ccc; cursor: pointer; }
        .training-label input { margin: 0; transform: scale(0.8); }

        /* 新設：宿縁・部隊バフエリア */
        .extra-input-area { background: #1a1a1a; padding: 5px; border: 1px solid #444; margin-top: 5px; }
        .syu-row { display: flex; justify-content: space-between; margin-bottom: 2px; align-items: center; font-size: 0.65rem; color: #aaa; }
        .syu-row input { width: 40px; background: #000; border: 1px solid var(--border-gold); color: white; text-align: center; font-size: 0.7rem; }

        .unit-result-area { border: 1px solid var(--border-gold); margin-top: 5px; background: #0d0d0d; }
        .res-toggle { background: #333; color: var(--border-gold); font-size: 0.75rem; padding: 4px; cursor: pointer; text-align: center; }
        .res-body { display: none; padding: 8px; font-size: 0.75rem; border-top: 1px solid #444; }
        .res-body.active { display: block; }
        .res-item { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .res-val { color: #00ff00; font-weight: bold; }

        .calc-btn { background-color: var(--accent-orange) !important; width: 1150px; height: 60px; font-size: 1.4rem !important; margin: 20px 0; border: none; color: white; cursor: pointer; }
        .vs-divider { text-align: center; font-size: 2.5rem; color: var(--border-gold); margin: 30px 0; font-weight: bold; }
    </style>
</head>
<body>

    <div id="app-wrapper" style="flex-direction: column; align-items: center;">
        <div id="capture-area">
            <div class="formation-header" style="width: 1110px; margin: 0 auto 20px;">
                <div class="header-left">
                    <div class="limit-container">
                        <span class="limit-label">全体条件</span>
                        <select id="global-limit" class="limit-select">
                            <option value="none">選択なし</option>
                            <option value="subjugation">同盟討伐戦</option>
                            <option value="hero">英雄台頭戦</option>
                            <option value="chain">連撃戦線</option>
                        </select>
                    </div>
                </div>
                <div class="header-right">
                    <div style="color:var(--border-gold); font-weight:bold; font-size:1.4rem;">数値計算シミュレーター</div>
                </div>
            </div>

            <div class="army-section">
                <div class="army-label player-label">自軍構成</div>
                <div id="player-grid" class="formation-grid"></div>
            </div>

            <div class="vs-divider">VS</div>

            <div class="army-section">
                <div class="army-label enemy-label">敵軍構成</div>
                <div id="enemy-grid" class="formation-grid"></div>
            </div>

            <button class="ctrl-btn calc-btn" onclick="calculateAll()">全部隊の計算実行</button>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span style="color:var(--border-gold); font-weight:bold;">武将選択</span>
                <button class="close-btn" onclick="closePopup()">&times;</button>
            </div>
            <div class="search-container">
                <input type="text" id="busho-search" class="search-box" placeholder="武将名で検索..." oninput="filterBushos()">
            </div>
            <div id="filter-tabs" style="display:flex; gap:2px; margin-bottom:10px;">
                <button class="tab-btn active" id="tab-country" onclick="switchTab('country')" style="flex:1; padding:8px;">国別</button>
                <button class="tab-btn" id="tab-belongs" onclick="switchTab('belongs')" style="flex:1; padding:8px;">所属別</button>
            </div>
            <div id="modal-body" class="scroll-area"></div>
        </div>
    </div>

    <div id="menu-overlay" class="menu-modal-overlay" onclick="closeMenu()"></div>
    <div id="menu-modal" class="menu-modal">
        <div id="menu-name" class="menu-title">武将名</div>
        <button class="menu-button" onclick="handleMenuSelection('change-busho')">武将変更</button>
        <button class="menu-button delete" onclick="handleMenuSelection('delete-img')">削除</button>
        <button class="menu-button cancel" onclick="closeMenu()">キャンセル</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="bushos-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
