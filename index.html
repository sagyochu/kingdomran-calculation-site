<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>キングダム乱 数値計算シミュレーター</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* レイアウト修正：はみ出し防止 */
        #capture-area { 
            width: 1150px; 
            margin: 0 auto;
            padding: 15px; 
            background: #000; 
            border: 2px solid #b59153;
            box-sizing: border-box; /* 枠線を含めたサイズ計算 */
        }
        .formation-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .army-section { width: 100%; margin-bottom: 30px; }
        .formation-grid { 
            display: flex; 
            gap: 10px; 
            justify-content: center; /* 中央寄せで均等配置 */
            width: 100%;
        }
        /* 各カラムの幅を固定し、7列が1150pxに収まるよう調整 */
        .unit-column { width: 150px; flex-shrink: 0; display: flex; flex-direction: column; gap: 5px; }

        .slot-wrapper { background: rgba(255,255,255,0.05); padding: 5px; border: 1px solid #333; }
        .training-settings { 
            background: rgba(0, 0, 0, 0.5); border: 1px solid #b59153; 
            padding: 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin-top: 4px;
        }
        .training-label { display: flex; align-items: center; gap: 2px; font-size: 0.6rem; color: #ccc; cursor: pointer; }
        .training-label input { margin: 0; transform: scale(0.8); }

        .extra-input-area { background: #1a1a1a; padding: 5px; border: 1px solid #444; margin-top: 5px; min-height: 60px; }
        .syu-row { display: flex; justify-content: space-between; margin-bottom: 2px; align-items: center; font-size: 0.65rem; color: #aaa; }
        .syu-row input { width: 40px; background: #000; border: 1px solid #b59153; color: white; text-align: center; font-size: 0.7rem; }

        .unit-result-area { border: 1px solid #b59153; margin-top: 5px; background: #0d0d0d; }
        .res-toggle { background: #333; color: #b59153; font-size: 0.75rem; padding: 4px; cursor: pointer; text-align: center; }
        .res-body { display: none; padding: 8px; font-size: 0.75rem; border-top: 1px solid #444; }
        .res-body.active { display: block; }

        .calc-btn { 
            background-color: #d48806; width: 100%; height: 60px; 
            font-size: 1.4rem; margin-top: 20px; border: none; color: white; cursor: pointer; font-weight: bold;
        }
        .vs-divider { text-align: center; font-size: 2.5rem; color: #b59153; margin: 20px 0; font-weight: bold; }

        /* モーダル表示の不具合修正：z-indexとdisplayを明示 */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 9999; 
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
        }
    </style>
</head>
<body>

    <div id="app-wrapper" style="display: flex; flex-direction: column; align-items: center; padding: 20px;">
        <div id="capture-area">
            <div class="formation-header">
                <div class="header-left">
                    <div class="limit-container" style="display:flex; border:1px solid #b59153;">
                        <span class="limit-label" style="background:#b59153; color:#000; padding:5px 10px; font-weight:bold; font-size:0.9rem;">全体条件</span>
                        <select id="global-limit" class="limit-select" style="background:#000; color:#fff; border:none; padding:5px;">
                            <option value="none">選択なし</option>
                            <option value="subjugation">同盟討伐戦</option>
                            <option value="hero">英雄台頭戦</option>
                            <option value="chain">連撃戦線</option>
                        </select>
                    </div>
                </div>
                <div class="header-right">
                    <div style="color:#b59153; font-weight:bold; font-size:1.4rem; letter-spacing: 2px;">数値計算シミュレーター</div>
                </div>
            </div>

            <div class="army-section">
                <div class="army-label player-label" style="background:#003366; color:white; padding:8px; text-align:center; font-weight:bold; margin-bottom:10px;">自軍構成</div>
                <div id="player-grid" class="formation-grid"></div>
            </div>

            <div class="vs-divider">VS</div>

            <div class="army-section">
                <div class="army-label enemy-label" style="background:#660000; color:white; padding:8px; text-align:center; font-weight:bold; margin-bottom:10px;">敵軍構成</div>
                <div id="enemy-grid" class="formation-grid"></div>
            </div>

            <button class="calc-btn" onclick="calculateAll()">全部隊の計算を実行</button>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content" style="background:#222; margin: 5% auto; padding: 20px; border: 1px solid #b59153; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto;">
            <div class="modal-header" style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid #b59153; padding-bottom:10px;">
                <span style="color:#b59153; font-weight:bold;">武将選択</span>
                <button onclick="closePopup()" style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <input type="text" id="busho-search" class="search-box" placeholder="武将名で検索..." oninput="filterBushos()" style="width:100%; padding:10px; background:#000; border:1px solid #b59153; color:#fff; margin-bottom:15px;">
            <div id="filter-tabs" style="display:flex; gap:5px; margin-bottom:15px;">
                <button class="tab-btn" onclick="switchTab('country')" style="flex:1; padding:10px; background:#444; color:#fff; border:none; cursor:pointer;">国別</button>
                <button class="tab-btn" onclick="switchTab('belongs')" style="flex:1; padding:10px; background:#444; color:#fff; border:none; cursor:pointer;">所属別</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <div id="menu-overlay" class="menu-modal-overlay" onclick="closeMenu()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:10000;"></div>
    <div id="menu-modal" class="menu-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#2a2a2a; border:2px solid #b59153; padding:20px; z-index:10001; width:250px; text-align:center;">
        <div id="menu-name" style="color:#b59153; font-weight:bold; margin-bottom:15px;">武将名</div>
        <button onclick="handleMenuSelection('change-busho')" style="width:100%; padding:10px; margin-bottom:5px; background:#444; color:#fff; border:none; cursor:pointer;">武将変更</button>
        <button onclick="handleMenuSelection('delete-img')" style="width:100%; padding:10px; background:#800; color:#fff; border:none; cursor:pointer;">削除</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="bushos-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
