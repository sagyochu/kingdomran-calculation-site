<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キングダム乱 数値計算シミュレーター</title>
    <style>
        :root { --gold: #b59153; --bg: #000; }
        body { background-color: #222; color: white; font-family: sans-serif; margin: 0; padding: 10px; }
        
        #capture-area { width: 1150px; margin: 0 auto; padding: 15px; background: var(--bg); border: 2px solid var(--gold); box-sizing: border-box; }
        
        /* ヘッダー：全体条件と計算ボタン */
        .top-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .limit-container { display: flex; border: 1px solid var(--gold); border-radius: 4px; overflow: hidden; height: 36px; }
        .limit-label { background: var(--gold); color: #000; padding: 0 12px; font-weight: bold; font-size: 0.85rem; line-height: 36px; }
        .limit-select { background: #000; color: #fff; border: none; padding: 0 10px; cursor: pointer; outline: none; height: 100%; }

        .calc-btn { 
            background: linear-gradient(to bottom, #d48806, #a06600); 
            color: white; padding: 0 25px; height: 36px; font-size: 0.9rem; 
            border: 1px solid var(--gold); border-radius: 4px; cursor: pointer; font-weight: bold; 
        }

        /* グリッドレイアウト */
        .formation-grid { display: flex; gap: 8px; justify-content: center; width: 100%; min-height: 400px; }
        .unit-column { width: 155px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; }
        
        .slot { width: 145px; height: 145px; background: #111; border: 1px solid #444; display: flex; align-items: center; justify-content: center; cursor: pointer; margin: 0 auto; position: relative; }
        .slot img { width: 100%; height: 100%; object-fit: cover; }
        
        .training-settings { background: rgba(255,255,255,0.05); border: 1px solid var(--gold); padding: 3px; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; }
        .training-label { font-size: 0.6rem; color: #ccc; display: flex; align-items: center; gap: 1px; white-space: nowrap; }
        .training-label input { transform: scale(0.75); margin: 0; }

        .extra-input-area { background: #111; padding: 4px; border: 1px solid #333; margin-top: 4px; min-height: 145px; }
        .syu-group { border: 1px solid #444; padding: 3px; margin-bottom: 4px; }
        .syu-title { color: var(--gold); font-size: 0.6rem; text-align: center; background: #222; margin-bottom: 2px; }
        .syu-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.6rem; color: #999; margin-bottom: 1px; }
        .syu-row input { width: 32px; background: #000; border: 1px solid var(--gold); color: white; text-align: center; }

        .unit-result-area { border: 1px solid var(--gold); margin-top: 4px; background: #050505; }
        .res-toggle { background: #333; color: var(--gold); font-size: 0.7rem; padding: 4px; cursor: pointer; text-align: center; }
        .res-body { display: none; padding: 5px; font-size: 0.7rem; }

        /* モーダル */
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
        .tab-btn { flex: 1; padding: 10px; background: #333; color: #fff; border: 1px solid #555; cursor: pointer; }
        .tab-btn.active { background: var(--gold); color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <div id="capture-area">
        <div class="top-controls">
            <div class="header-left">
                <div class="limit-container">
                    <span class="limit-label">全体条件</span>
                    <select id="global-limit" class="limit-select">
                        <option value="none">選択なし</option>
                        <option value="subjugation">同盟討伐戦</option>
                        <option value="hero">英雄台頭戦</option>
                        <option value="chain">連撃戦線</option>
                    </select>
                </div>
                <button id="main-calc-btn" class="calc-btn">計算を実行</button>
            </div>
            <div style="color:var(--gold); font-weight:bold; font-size:1.1rem;">軍構成シミュレーター</div>
        </div>

        <div id="player-grid" class="formation-grid"></div>
        <div style="text-align: center; color: var(--gold); font-size: 1.5rem; font-weight: bold; margin: 10px 0;">VS</div>
        <div id="enemy-grid" class="formation-grid"></div>
    </div>

    <div id="modal" class="modal">
        <div style="background:#222; margin: 2% auto; padding: 20px; border: 1px solid var(--gold); width: 90%; max-width: 600px; height: 85vh; display: flex; flex-direction: column;">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span style="color:var(--gold); font-weight:bold;">武将選択</span>
                <button id="close-modal-btn" style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <input type="text" id="busho-search" placeholder="武将名で検索..." style="width:100%; padding:10px; background:#000; border:1px solid var(--gold); color:#fff; margin-bottom:10px; box-sizing:border-box;">
            <div style="display:flex; gap:5px; margin-bottom:10px;">
                <button id="btn-tab-country" class="tab-btn active">国別</button>
                <button id="btn-tab-belongs" class="tab-btn">所属別</button>
            </div>
            <div id="modal-body" style="flex:1; overflow-y:auto; border-top: 1px solid #444;"></div>
        </div>
    </div>

    <div id="menu-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:10000;"></div>
    <div id="menu-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#2a2a2a; border:2px solid var(--gold); padding:20px; z-index:10001; width:220px; text-align:center;">
        <div id="menu-name" style="color:var(--gold); font-weight:bold; margin-bottom:15px;"></div>
        <button id="menu-change-btn" style="width:100%; padding:10px; margin-bottom:5px; background:#444; color:#fff; border:none; cursor:pointer;">武将変更</button>
        <button id="menu-delete-btn" style="width:100%; padding:10px; background:#800; color:#fff; border:none; cursor:pointer;">削除</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="bushos-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
