<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>キングダム乱 数値計算シミュレーター</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="vs-calc.css"> </head>
<body>

    <div id="app-wrapper">
        <div id="capture-area">
            <div class="formation-header">
                <div class="header-left">
                    <div class="limit-container">
                        <span class="limit-label">戦場条件</span>
                        <select id="global-limit" class="limit-select">
                            <option value="subjugation">選択なし</option>
                            <option value="subjugation">同盟討伐戦</option>
                            <option value="subjugation">英雄台頭戦</option>
                            <option value="all-out">連撃戦線</option>
                        </select>
                    </div>
                </div>
                <div class="header-right">
                    <div class="calc-title">数値計算シミュレーター</div>
                </div>
            </div>

            <div class="army-label player-label">自軍部隊 (青)</div>
            <div id="player-unit-container" class="formation-grid">
                </div>

            <div class="vs-divider">VS</div>

            <div class="army-label enemy-label">敵軍部隊 (赤)</div>
            <div id="enemy-unit-container" class="formation-grid">
                </div>

            <div id="traits-container" class="traits-section">
                <h3 class="section-title">武将固有特性入力</h3>
                <div id="traits-inputs" class="traits-grid">
                    </div>
            </div>

            <div class="calc-trigger-area">
                <button class="ctrl-btn calc-btn" onclick="executeCalculation()">計算実行・反映</button>
            </div>

            <div id="result-display" class="result-section">
                <h3 class="section-title">計算結果（バフ・デバフ詳細）</h3>
                
                <div class="result-group">
                    <h4 class="group-toggle player-toggle" onclick="toggleResult('player-res')">▼ 自軍バフ詳細</h4>
                    <div id="player-res" class="result-content">
                        </div>
                </div>

                <div class="result-group">
                    <h4 class="group-toggle enemy-toggle" onclick="toggleResult('enemy-res')">▼ 敵軍デバフ詳細</h4>
                    <div id="enemy-res" class="result-content">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">...</div>
    <div id="menu-modal" class="menu-modal">...</div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="bushos-data.js"></script>
    <script src="bushos-skills.js"></script> <script src="vs-script.js"></script> </body>
</html>
