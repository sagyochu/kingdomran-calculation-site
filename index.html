<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>キングダム乱 数値計算シミュレーター</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #capture-area { width: 1150px; margin: 0 auto; padding: 15px; background: #000; border: 2px solid #b59153; box-sizing: border-box; }
        .formation-grid { display: flex; gap: 10px; justify-content: center; width: 100%; }
        .unit-column { width: 150px; flex-shrink: 0; display: flex; flex-direction: column; gap: 5px; }
        .slot { width: 140px; height: 140px; background: #222; border: 1px solid #444; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; margin: 0 auto; }
        .slot img { width: 100%; height: 100%; object-fit: cover; }
        
        .training-settings { background: rgba(0, 0, 0, 0.5); border: 1px solid #b59153; padding: 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin-top: 4px; }
        .training-label { display: flex; align-items: center; gap: 2px; font-size: 0.6rem; color: #ccc; cursor: pointer; }
        .training-label input { margin: 0; transform: scale(0.8); }

        /* 宿縁・宿運 2枠化 */
        .extra-input-area { background: #1a1a1a; padding: 5px; border: 1px solid #444; margin-top: 5px; }
        .syu-group { border: 1px solid #333; padding: 3px; margin-bottom: 5px; border-radius: 3px; }
        .syu-title { color: #b59153; font-size: 0.6rem; text-align: center; margin-bottom: 2px; background: #222; }
        .syu-row { display: flex; justify-content: space-between; margin-bottom: 2px; align-items: center; font-size: 0.6rem; color: #aaa; }
        .syu-row input { width: 35px; background: #000; border: 1px solid #b59153; color: white; text-align: center; font-size: 0.7rem; }

        .unit-result-area { border: 1px solid #b59153; margin-top: 5px; background: #0d0d0d; }
        .res-toggle { background: #333; color: #b59153; font-size: 0.75rem; padding: 4px; cursor: pointer; text-align: center; }
        .res-body { display: none; padding: 8px; font-size: 0.75rem; border-top: 1px solid #444; }
        .res-body.active { display: block; }

        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
        .tab-btn { flex: 1; padding: 10px; background: #333; color: #fff; border: 1px solid #555; cursor: pointer; }
        .tab-btn.active { background: #b59153; color: #000; font-weight: bold; }
        .calc-btn { background-color: #d48806; width: 1150px; height: 60px; font-size: 1.4rem; margin-top: 20px; border: none; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="app-wrapper" style="display: flex; flex-direction: column; align-items: center; padding: 20px;">
        <div id="capture-area">
            <div id="player-grid" class="formation-grid" style="margin-bottom: 20px;"></div>
            <div style="text-align: center; color: #b59153; font-size: 2rem; font-weight: bold; margin: 15px 0;">VS</div>
            <div id="enemy-grid" class="formation-grid"></div>
            <button class="calc-btn" onclick="calculateAll()">全部隊の計算を実行</button>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content" style="background:#222; margin: 2% auto; padding: 20px; border: 1px solid #b59153; width: 90%; max-width: 700px; height: 90vh; display: flex; flex-direction: column;">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span style="color:#b59153; font-weight:bold;">武将選択</span>
                <button onclick="closePopup()" style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <input type="text" id="busho-search" placeholder="武将名で検索..." oninput="onSearchInput()" style="width:100%; padding:10px; background:#000; border:1px solid #b59153; color:#fff; margin-bottom:10px;">
            <div style="display:flex; gap:5px; margin-bottom:10px;">
                <button id="btn-tab-country" class="tab-btn active" onclick="switchTab('country')">国別</button>
                <button id="btn-tab-belongs" class="tab-btn" onclick="switchTab('belongs')">所属別</button>
            </div>
            <div id="modal-body" style="flex:1; overflow-y:auto; border-top: 1px solid #444; padding-top: 10px;"></div>
        </div>
    </div>

    <div id="menu-overlay" onclick="closeMenu()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:10000;"></div>
    <div id="menu-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#2a2a2a; border:2px solid #b59153; padding:20px; z-index:10001; width:250px; text-align:center;">
        <div id="menu-name" style="color:#b59153; font-weight:bold; margin-bottom:15px;"></div>
        <button onclick="handleMenuSelection('change-busho')" style="width:100%; padding:10px; margin-bottom:5px; background:#444; color:#fff; border:none; cursor:pointer;">武将変更</button>
        <button onclick="handleMenuSelection('delete-img')" style="width:100%; padding:10px; background:#800; color:#fff; border:none; cursor:pointer;">削除</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="bushos-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
